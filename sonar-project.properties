# Configuración del análisis estático con SonarQube (Actividad 1.2).
# El escáner se lanza con scripts/sonar-escaneo.ps1 (Windows) o scripts/sonar-escaneo.sh (Linux/macOS),
# que sobrescriben sonar.projectKey para que cada integrante analice su propio proyecto.

sonar.projectKey=habitos-tracker
sonar.projectName=Habitos Tracker
sonar.projectVersion=0.1.0

# Código de producción y pruebas
sonar.sources=web/src,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.js,tests/**/*.mjs

# Fuera del análisis: librerías de terceros, resultados y dependencias
sonar.exclusions=web/vendor/**,node_modules/**,tests/carga/resultados/**,**/*.min.js,playwright-report/**
sonar.coverage.exclusions=tests/**,scripts/**

sonar.sourceEncoding=UTF-8

# Cobertura: se genera con `npm run test:cobertura` antes de escanear (opcional).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
