# Valida la configuración del stack de monitoreo (Actividad 3.1, spec 005).
#
# Una regla de alerta mal escrita no se nota hasta que hace falta. Este flujo la revisa en cada
# cambio de infra/monitoreo/ con las mismas herramientas de las imágenes oficiales.
name: Monitoreo

on:
  push:
    branches: [main, develop]
    paths:
      - infra/monitoreo/**
      - .github/workflows/monitoreo.yml
  pull_request:
    branches: [main, develop]
    paths:
      - infra/monitoreo/**
      - .github/workflows/monitoreo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoreo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuracion:
    name: Configuración y reglas
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Revisar prometheus.yml y reglas.yml
        run: |
          docker run --rm -v "$PWD/infra/monitoreo/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infra/monitoreo/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check rules /etc/prometheus/reglas.yml

      - name: Revisar alertmanager.yml
        run: |
          docker run --rm -v "$PWD/infra/monitoreo/alertmanager:/etc/alertmanager:ro" \
            --entrypoint amtool prom/alertmanager:v0.28.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Revisar que el tablero de Grafana sea JSON válido
        run: node -e "const t=require('./infra/monitoreo/grafana/tableros/habitos-tracker.json');if(!t.panels?.length)throw new Error('El tablero no tiene paneles');console.log(`Tablero «${t.title}» con ${t.panels.length} paneles`)"

      - name: Revisar que el compose sea consistente
        run: docker compose -f infra/monitoreo/docker-compose.yml config --quiet

  levantar:
    name: Levantar el stack y comprobar las sondas
    runs-on: ubuntu-latest
    needs: configuracion
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Servir el panel
        run: |
          node scripts/serve.mjs &
          for i in $(seq 1 20); do
            curl -fsS http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:4173/

      - name: Levantar Prometheus, Alertmanager, Blackbox y Grafana
        run: docker compose -f infra/monitoreo/docker-compose.yml up -d --wait --wait-timeout 180

      - name: Comprobar que la sonda del panel local responde
        run: |
          # host.docker.internal se resuelve por extra_hosts; en el servidor el panel corre en el anfitrión.
          for i in $(seq 1 24); do
            exito=$(curl -fsS "http://localhost:9090/api/v1/query?query=probe_success%7Bentorno%3D%22local%22%7D" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d).data.result;console.log(r[0]?.value?.[1] ?? 'sin-datos')})")
            echo "intento $i: probe_success=$exito"
            [ "$exito" = "1" ] && exit 0
            sleep 5
          done
          echo "La sonda del panel local nunca llegó a 1."
          docker compose -f infra/monitoreo/docker-compose.yml logs --tail 50
          exit 1

      - name: Comprobar que Grafana aprovisionó el tablero
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3001/api/search?query=Hábitos | grep -q habitos-entorno; then
              echo "Tablero aprovisionado."
              exit 0
            fi
            sleep 3
          done
          echo "Grafana no aprovisionó el tablero."
          exit 1

      - name: Apagar el stack
        if: always()
        run: docker compose -f infra/monitoreo/docker-compose.yml down -v
