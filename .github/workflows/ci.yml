# Integración continua — spec 003 (specs/003-infraestructura-cicd/contracts/pipelines.md §1).
#
# Cada `name:` de job es el nombre de un check requerido por la protección de ramas
# (infra/terraform/variables.tf → checks_requeridos). Cambiar un nombre es un cambio de
# contrato: se actualizan el contrato y Terraform en el mismo PR.
#
# Los jobs de componentes dependen de `detectar`. Si un componente aún no existe, su job se
# omite por el `if` y GitHub lo reporta como "skipped", que cuenta como exitoso en los checks
# requeridos. No se usan filtros `paths`: con ellos el workflow no se dispararía y los checks
# requeridos quedarían "pendientes" para siempre, bloqueando el merge.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  # `push` a main no dispara esta CI directamente: la invoca cd.yml como primera etapa,
  # así no se ejecuta dos veces la misma CI.
  workflow_call:
    outputs:
      web:
        description: "'true' si existen package.json y web/index.html"
        value: ${{ jobs.detectar.outputs.web }}
      api:
        description: "'true' si existe api/composer.json"
        value: ${{ jobs.detectar.outputs.api }}
      app:
        description: "'true' si existe app/gradlew"
        value: ${{ jobs.detectar.outputs.app }}
      iac:
        description: "'true' si existe infra/terraform/versions.tf"
        value: ${{ jobs.detectar.outputs.iac }}
  workflow_dispatch:

# La CI no usa secretos: funciona igual en PRs que vienen de forks.
permissions:
  contents: read

# Solo se cancelan las ejecuciones obsoletas de un mismo PR; en develop y dentro del CD
# cada ejecución termina.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detectar:
    name: Detectar componentes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.marcadores.outputs.web }}
      api: ${{ steps.marcadores.outputs.api }}
      app: ${{ steps.marcadores.outputs.app }}
      iac: ${{ steps.marcadores.outputs.iac }}
    steps:
      - uses: actions/checkout@v7

      - name: Buscar archivos marcadores
        id: marcadores
        run: |
          existe() {
            if [ -f "$1" ]; then echo true; else echo false; fi
          }

          web=false
          if [ -f package.json ] && [ -f web/index.html ]; then web=true; fi
          api=$(existe api/composer.json)
          app=$(existe app/gradlew)
          iac=$(existe infra/terraform/versions.tf)

          {
            echo "web=$web"
            echo "api=$api"
            echo "app=$app"
            echo "iac=$iac"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Componentes detectados"
            echo ""
            echo "| Componente | Marcador | ¿Se verifica? |"
            echo "|---|---|---|"
            echo "| Panel web | \`package.json\` y \`web/index.html\` | $web |"
            echo "| API | \`api/composer.json\` | $api |"
            echo "| App | \`app/gradlew\` | $app |"
            echo "| IaC | \`infra/terraform/versions.tf\` | $iac |"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web - unit + e2e (Playwright)
    needs: detectar
    if: needs.detectar.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm run test:unit

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas end-to-end
        run: npm run test:e2e

      - name: Publicar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  api:
    name: API (Laravel) - Tests
    needs: detectar
    if: needs.detectar.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      # Laravel necesita APP_KEY aunque las pruebas usen phpunit.xml; si el proyecto trae
      # .env.example se genera un .env efímero solo para esta ejecución.
      - name: Preparar .env de pruebas
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            php artisan key:generate
          fi

      - name: Pruebas
        run: php artisan test

  app:
    name: App (Android) - Build & Unit Tests
    needs: detectar
    if: needs.detectar.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Un gradlew commiteado desde Windows puede llegar sin el bit de ejecución.
      - name: Permiso de ejecución para gradlew
        run: chmod +x gradlew

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest

  iac:
    name: IaC - Terraform validate
    needs: detectar
    if: needs.detectar.outputs.iac == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Formato
        run: terraform fmt -check -recursive

      # Sin backend ni credenciales: solo descarga los proveedores fijados en el lock.
      - name: Inicializar
        run: terraform init -backend=false

      - name: Validar
        run: terraform validate

  sdd:
    name: SDD - Specs completas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verificar spec.md, plan.md y tasks.md en cada carpeta de specs/
        run: node scripts/verificar-specs.mjs
