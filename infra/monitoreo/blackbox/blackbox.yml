# Módulos del exportador blackbox (spec 005).
modules:
  # Sonda estándar: GET y se espera 200. Sirve para el panel publicado y para el local.
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      valid_status_codes: [200]
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  # Comprueba además que la página servida sea realmente el panel y no una página de error.
  http_panel:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: true
      fail_if_body_not_matches_regexp:
        - "Hábitos Tracker"
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
