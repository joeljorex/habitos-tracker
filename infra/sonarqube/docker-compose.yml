# Stack local de SonarQube Community para el análisis estático del proyecto (Actividad 1.2).
# Levantar:  docker compose -f infra/sonarqube/docker-compose.yml up -d
# Apagar:    docker compose -f infra/sonarqube/docker-compose.yml down
# Borrar todo (incluidos los datos): agregar -v al down.
name: habitos-sonarqube

services:
  db:
    image: postgres:17-alpine
    container_name: habitos-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    container_name: habitos-sonarqube
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - datos_sonar:/opt/sonarqube/data
      - extensiones_sonar:/opt/sonarqube/extensions
      - logs_sonar:/opt/sonarqube/logs
    healthcheck:
      # La imagen de SonarQube trae curl, no wget.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s

volumes:
  datos_db:
  datos_sonar:
  extensiones_sonar:
  logs_sonar:
